<!-- ── Consent Mode v2 default — must load before any Google tag, ad-related
     or not, so ad_storage/ad_user_data/ad_personalization start denied until
     the visitor actually accepts (assets/js/app.js's consent handler calls
     gtag('consent','update', …) on accept). See README.md → "AdSense". ──── -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied'
  });
</script>
